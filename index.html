<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Edward Scorpio">
<title>PDF → Markdown</title>
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="/pdf-inspector/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/pdf-inspector/manifest.webmanifest">
<style>
  :root{
    --paper:#f6f1e7; --card:#fffdf7; --ink:#33302a; --dim:#8a8374;
    --line:#e0d7c4; --accent:#a1793f; --accent-soft:#efe3c8;
    --ok:#5c8a5a; --warn:#b0783a;
    --shadow:0 1px 2px rgba(90,80,60,.08),0 6px 24px rgba(90,80,60,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font:16px/1.55 Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;}
  ::selection{background:#f3e3bd;}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid #d9c49a;}
  a:hover{border-bottom-color:var(--accent);}
  main{max-width:640px;margin:0 auto;padding:34px 18px 56px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
  .mark{font:700 13px/1 "Trebuchet MS",sans-serif;letter-spacing:4px;color:var(--accent);text-transform:uppercase;}
  .mark span{color:var(--dim);letter-spacing:2px;}
  .author-link{font:13px/1 "Trebuchet MS",sans-serif;color:var(--dim);border-bottom:1px solid var(--line);}
  .author-link:hover{border-bottom-color:var(--accent);color:var(--accent);}
  h1{font-size:30px;line-height:1.2;margin:0 0 4px;font-weight:400;letter-spacing:-.5px;}
  .tag{font:13px/1.6 "Trebuchet MS",sans-serif;color:var(--dim);margin:0 0 20px;}
  .drop{border:2px dashed #cfc2a6;border-radius:16px;background:var(--card);
    padding:38px 24px;text-align:center;color:var(--dim);cursor:pointer;
    transition:border-color .15s,background .15s;
    box-shadow:var(--shadow);}
  .drop:hover,.drop.over{border-color:var(--accent);background:#fffdf4;}
  .drop-icon{font-size:30px;line-height:1;margin-bottom:8px;color:#c9b88f;}
  .drop b{color:var(--ink);font-weight:700;}
  .hint{font:13px/1.6 "Trebuchet MS",sans-serif;color:#9a927f;margin-top:8px;}
  .meta-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px;
    font:13px/1 "Trebuchet MS",sans-serif;color:var(--dim);}
  #status{flex:1;min-width:200px;font:13px/1.5 "Trebuchet MS",sans-serif;}
  #status.err{color:var(--warn);}
#list{display:grid;gap:10px;}
  .file{display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    box-shadow:var(--shadow);}
  .file .info{flex:1;min-width:0;}
  .file h3{margin:0;font-size:15px;font-weight:400;word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file .meta{font:12px/1.5 "Trebuchet MS",sans-serif;color:var(--dim);margin-top:2px;}
  .file .meta .ok{color:var(--ok);}
  .file .meta .warn{color:var(--warn);}
  .file .acts{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  .file .acts.hidden{display:none;}
  .btn{
    font:700 13px/1 "Trebuchet MS",sans-serif;color:#fff;
    background:var(--accent);border:none;border-radius:8px;
    padding:10px 16px;cursor:pointer;
    transition:filter .15s,transform .1s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);}
  .btn.ghost:hover{background:#f4ecdc;}
  .btn.mini{padding:8px 12px;font-size:12px;}
  .btn.del{background:none;border:none;color:#c9b88f;cursor:pointer;font:16px/1 sans-serif;padding:4px 6px;}
  .btn.del:hover{color:var(--warn);}
  .file details{margin:0;}
  .file summary{cursor:pointer;font:12px/1 "Trebuchet MS",sans-serif;color:var(--accent);border-bottom:1px solid #d9c49a;}
  .file summary:hover{border-bottom-color:var(--accent);}
  .file textarea{width:100%;min-height:160px;margin-top:10px;background:#faf7ef;color:#3c382f;
    border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 "Courier New",monospace;resize:vertical;white-space:pre;}
  footer{margin-top:40px;text-align:center;font:12px/1.8 "Trebuchet MS",sans-serif;color:#9a927f;}
  .hidden{display:none;}
  *:focus-visible{outline:2px dotted var(--accent);outline-offset:2px;}
  @media(max-width:520px){
    main{padding:24px 14px 40px;}
    h1{font-size:25px;}
    .drop{padding:30px 16px;}
    .file{flex-wrap:wrap;}
    .file .acts{width:100%;justify-content:flex-end;}
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="mark">PDF<span>&nbsp;→&nbsp;</span>MD</div>
    <a class="author-link" href="https://github.com/EdwardScorpio" rel="noopener">by Edward Scorpio</a>
  </div>

  <h1>PDF → Markdown</h1>
  <p class="tag">Бесплатно · без сервера · файлы не покидают ваше устройство</p>

  <div class="drop" id="drop">
    <div class="drop-icon">&#8595;</div>
    <div>Перетащите PDF сюда или <b>выберите файл</b></div>
    <div class="hint">можно несколько файлов · конвертация начнётся сразу</div>
  </div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>

  <div class="meta-bar">
    <div id="status"></div>
    <button class="btn mini ghost" id="zipBtn" style="display:none">Скачать все (.zip)</button>
  </div>

  <div id="list"></div>

  <footer>
    На базе <a href="https://github.com/firecrawl/pdf-inspector" rel="noopener">pdf-inspector</a> (WebAssembly) ·
    автор <a href="https://github.com/EdwardScorpio" rel="noopener">Edward Scorpio</a>
  </footer>
</main>

<script>
(function(){
  var STATUS = document.getElementById("status");
  function status(text, isErr){
    if (!text) { STATUS.textContent = ""; STATUS.className = ""; return; }
    STATUS.textContent = text;
    STATUS.className = isErr ? "err" : "";
  }

  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("fileInput");
  var list = document.getElementById("list");
  var zipBtn = document.getElementById("zipBtn");

  var items = [];
  var files = [];
  var seq = 0;
  var busy = false;

  var worker = null;
  var workerReady = false;
  var workerError = null;
  var pending = {};

  function startWorker(){
    if (worker) return;
    try {
      worker = new Worker("/pdf-inspector/worker.js", { type: "module" });
    } catch (e) {
      workerError = "web worker не поддерживается: " + e;
      status("Ошибка: " + workerError, true);
      return;
    }
    worker.onmessage = function (ev) {
      var m = ev.data;
      if (m.type === "ready") {
        workerReady = true;
        pumpQueue();
      } else if (m.type === "error") {
        workerError = m.message;
        status("Ошибка: " + m.message, true);
      } else if (m.type === "done") {
        handleDone(m);
      }
    };
    worker.onerror = function (e) {
      workerError = (e && e.message) || "worker failed";
      status("Ошибка: " + workerError, true);
    };
    status("Загружаю конвертер (~5 МБ)…");
  }

  function addFiles(listNew){
    var added = 0;
    for (var i = 0; i < listNew.length; i++) {
      var f = listNew[i];
      if (f.type !== "application/pdf" && !f.name.toLowerCase().endsWith(".pdf")) continue;
      items.push(f);
      files.push(f);
      added++;
    }
    if (added > 0) {
      renderList();
      startWorker();
      pumpQueue();
    }
  }

  function renderList(){
    list.textContent = "";
    items.forEach(function (f) {
      var row = document.createElement("div");
      row.className = "file";

      var info = document.createElement("div");
      info.className = "info";
      var h = document.createElement("h3");
      h.textContent = f.name;
      var meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = f._status || fmtSize(f.size);
      info.appendChild(h); info.appendChild(meta);

      var acts = document.createElement("div");
      acts.className = "acts" + (f._actsBuilt ? "" : " hidden");

      var del = document.createElement("button");
      del.className = "btn del";
      del.title = "Убрать из списка";
      del.textContent = "×";
      del.onclick = function () {
        var i = items.indexOf(f);
        if (i >= 0) items.splice(i, 1);
        var j = files.indexOf(f);
        if (j >= 0) files.splice(j, 1);
        renderList();
        updateZipBtn();
        pumpQueue();
      };

      row.appendChild(info); row.appendChild(acts); row.appendChild(del);
      list.appendChild(row);
      f._meta = meta; f._acts = acts;
      if (f._actions) {
        f._acts.textContent = "";
        f._actions.forEach(function (el) { f._acts.appendChild(el); });
      }
    });
  }

  function fmtSize(n){
    if (n < 1024) return n + " Б";
    if (n < 1048576) return (n / 1024).toFixed(1) + " КБ";
    return (n / 1048576).toFixed(2) + " МБ";
  }

  function pumpQueue(){
    if (busy || !workerReady || files.length === 0) return;
    busy = true;
    var f = files.shift();
    var id = ++seq;
    f._status = fmtSize(f.size) + " · конвертирую…";
    f._meta.textContent = f._status;
    status("Конвертирую: " + f.name);
    f.arrayBuffer().then(function (buf) {
      var t0 = Date.now();
      worker.postMessage({ type: "convert", id: id, buffer: buf }, [buf]);
      pending[id] = { file: f, t0: t0 };
    }).catch(function (e) {
      f._status = fmtSize(f.size) + " · ошибка чтения";
      f._meta.textContent = f._status;
      busy = false;
      pumpQueue();
    });
  }

  function handleDone(m){
    var item = pending[m.id];
    if (!item) return;
    delete pending[m.id];
    var f = item.file;
    var ms = Date.now() - item.t0;
    busy = false;

    if (m.error) {
      f._status = fmtSize(f.size) + " · ошибка: " + m.error;
      renderList();
      pumpQueue();
      return;
    }
    var r = m.result;
    var typeMap = { TextBased: "текстовый", Scanned: "скан", ImageBased: "изображение", Mixed: "смешанный" };
    var tl = typeMap[r.pdfType] || r.pdfType;

    if (r.markdown) {
      f._markdown = r.markdown;
      f._status = fmtSize(f.size) + " · " + tl + " · готово";
      f._done = true;
      buildActions(f);
      renderList();
      updateZipBtn();
    } else {
      var why = "текст не извлечён";
      if (r.pdfType === "Scanned" || r.pdfType === "ImageBased") {
        why = "это скан (фотографии) — нужна отдельная программа распознавания текста (OCR)";
      }
      f._status = fmtSize(f.size) + " · " + tl + " · " + why;
      renderList();
    }

    if (files.length === 0) {
      status("");
    } else {
      pumpQueue();
    }
  }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function buildActions(f){
    f._actions = [];
    var dl = document.createElement("button");
    dl.className = "btn mini";
    dl.textContent = "Скачать .md";
    dl.onclick = function () { downloadMd(f); };
    var cp = document.createElement("button");
    cp.className = "btn ghost mini";
    cp.textContent = "Копировать";
    cp.onclick = function () { copyMd(f, cp); };
    var dt = document.createElement("details");
    var sm = document.createElement("summary");
    sm.textContent = "показать";
    var ta = document.createElement("textarea");
    ta.value = f._markdown;
    ta.readOnly = true;
    dt.appendChild(sm); dt.appendChild(ta);
    f._actions.push(dl); f._actions.push(cp); f._actions.push(dt);
  }

  function baseName(name){
    var s = name.toLowerCase();
    return s.endsWith(".pdf") ? name.slice(0, -4) : name;
  }

  function downloadMd(f){
    var blob = new Blob([f._markdown], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = baseName(f.name) + ".md";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 900);
  }

  function copyMd(f, btnEl){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(f._markdown).then(function () {
        btnEl.textContent = "готово!";
        setTimeout(function () { btnEl.textContent = "Копировать"; }, 1200);
      });
    } else {
      var ta = document.createElement("textarea");
      ta.value = f._markdown;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
  }

  function updateZipBtn(){
    var done = items.filter(function (f) { return f._done; }).length;
    zipBtn.style.display = done >= 2 ? "" : "none";
  }

  function crc32(buf){
    var table = crc32._t || (crc32._t = (function () {
      var t = new Uint32Array(256);
      for (var i = 0; i < 256; i++) {
        var c = i;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })());
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZip(filesArr){
    var enc = new TextEncoder();
    var parts = [];
    var central = [];
    var offset = 0;

    filesArr.forEach(function (f) {
      var name = baseName(f.name) + ".md";
      var nameBuf = enc.encode(name);
      var dataBuf = enc.encode(f._markdown);

      var local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true);
      local.setUint16(8, 0, true);
      local.setUint16(10, 0, true);
      local.setUint16(12, 0, true);
      local.setUint32(14, crc32(dataBuf), true);
      local.setUint32(18, dataBuf.length, true);
      local.setUint32(22, dataBuf.length, true);
      local.setUint16(26, nameBuf.length, true);
      local.setUint16(28, 0, true);

      parts.push(new Uint8Array(local.buffer));
      parts.push(nameBuf);
      parts.push(dataBuf);

      var cent = new DataView(new ArrayBuffer(46));
      cent.setUint32(0, 0x02014b50, true);
      cent.setUint16(4, 20, true);
      cent.setUint16(6, 20, true);
      cent.setUint16(8, 0x0800, true);
      cent.setUint16(10, 0, true);
      cent.setUint16(12, 0, true);
      cent.setUint16(14, 0, true);
      cent.setUint32(16, crc32(dataBuf), true);
      cent.setUint32(20, dataBuf.length, true);
      cent.setUint32(24, dataBuf.length, true);
      cent.setUint16(28, nameBuf.length, true);
      cent.setUint16(30, 0, true);
      cent.setUint16(32, 0, true);
      cent.setUint16(34, 0, true);
      cent.setUint16(36, 0, true);
      cent.setUint32(38, 0, true);
      cent.setUint32(42, offset, true);

      central.push(new Uint8Array(cent.buffer));
      central.push(nameBuf);
      offset += 30 + nameBuf.length + dataBuf.length;
    });

    var centralSize = central.reduce(function (n, b) { return n + b.length; }, 0);
    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(4, 0, true);
    eocd.setUint16(6, 0, true);
    eocd.setUint16(8, filesArr.length, true);
    eocd.setUint16(10, filesArr.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, offset, true);
    eocd.setUint16(20, 0, true);

    var blobParts = parts.concat(central);
    blobParts.push(new Uint8Array(eocd.buffer));
    return new Blob(blobParts, { type: "application/zip" });
  }

  function downloadZip(){
    var done = items.filter(function (f) { return f._done; });
    if (done.length < 2) return;
    var blob = buildZip(done);
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "markdown.zip";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 900);
  }

  zipBtn.addEventListener("click", downloadZip);

  drop.addEventListener("click", function () { fileInput.click(); });
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault();
    drop.classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files) addFiles(Array.prototype.slice.call(e.dataTransfer.files));
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files) addFiles(Array.prototype.slice.call(fileInput.files));
    fileInput.value = "";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/pdf-inspector/sw.js").catch(function () {});
  }

  var q = new URLSearchParams(location.search);
  if (q.get("shared") === "1") {
    fetch("/pdf-inspector/shared-file").then(function (r) {
      if (!r.ok) throw new Error("no shared file");
      return r.blob();
    }).then(function (blob) {
      var f = new File([blob], "shared.pdf", { type: "application/pdf" });
      addFiles([f]);
    }).catch(function (e) {
      status("Не удалось получить файл из «Поделиться»", true);
    });
  }
  if (q.get("shared") === "error") {
    status("Не удалось получить файл из «Поделиться»", true);
  }
})();
</script>
</body>
</html>
