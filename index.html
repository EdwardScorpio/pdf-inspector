<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Edward Scorpio">
<title>PDF → Markdown</title>
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="/pdf-inspector/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/pdf-inspector/manifest.webmanifest">
<style>
  :root{
    --paper:#f6f1e7; --card:#fffdf7; --ink:#33302a; --dim:#8a8374;
    --line:#e0d7c4; --accent:#a1793f; --accent-soft:#efe3c8;
    --ok:#5c8a5a; --warn:#b0783a;
    --shadow:0 1px 2px rgba(90,80,60,.08),0 6px 24px rgba(90,80,60,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font:17px/1.6 Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;}
  ::selection{background:#f3e3bd;}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid #d9c49a;}
  a:hover{border-bottom-color:var(--accent);}
  main{max-width:680px;margin:0 auto;padding:56px 20px 72px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;}
  .mark{font:700 13px/1 "Trebuchet MS",sans-serif;letter-spacing:4px;color:var(--accent);text-transform:uppercase;}
  .mark span{color:var(--dim);letter-spacing:2px;}
  .author-link{font:13px/1 "Trebuchet MS",sans-serif;color:var(--dim);border-bottom:1px solid var(--line);}
  .author-link:hover{border-bottom-color:var(--accent);color:var(--accent);}
  header{margin-bottom:34px;}
  h1{font-size:42px;line-height:1.15;margin:0 0 10px;font-weight:400;letter-spacing:-.5px;}
  .tag{font:15px/1.6 "Trebuchet MS",sans-serif;color:var(--dim);margin:0;}
  .drop{border:2px dashed #cfc2a6;border-radius:16px;background:var(--card);
    padding:52px 24px;text-align:center;color:var(--dim);cursor:pointer;
    transition:border-color .15s,background .15s,transform .15s;
    box-shadow:var(--shadow);}
  .drop:hover,.drop.over{border-color:var(--accent);background:#fffdf4;}
  .drop.over{transform:scale(1.01);}
  .drop-icon{font-size:38px;line-height:1;margin-bottom:12px;color:#c9b88f;}
  .drop b{color:var(--ink);font-weight:700;}
  .hint{font:13px/1.6 "Trebuchet MS",sans-serif;color:#9a927f;margin-top:10px;}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;}
  .btn{
    font:700 14px/1 "Trebuchet MS",sans-serif;color:#fff;
    background:var(--accent);border:none;border-radius:10px;
    padding:13px 24px;cursor:pointer;box-shadow:0 1px 3px rgba(120,90,40,.25);
    transition:filter .15s,transform .1s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--dim);box-shadow:none;border:1px solid var(--line);}
  .btn.ghost:hover{background:#f4ecdc;filter:none;}
  .btn.mini{padding:8px 14px;font-size:13px;border-radius:8px;}
  label.check{display:flex;gap:8px;align-items:center;font:14px/1 "Trebuchet MS",sans-serif;color:var(--dim);cursor:pointer;user-select:none;}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;}
  #status{margin-top:26px;font:14px/1.7 "Trebuchet MS",sans-serif;color:var(--dim);min-height:24px;}
  #status .ln{white-space:pre-wrap;word-break:break-word;padding:2px 0;}
  #status .ln.ok{color:var(--ok);}
  #status .ln.err{color:var(--warn);}
  #list{margin-top:26px;display:grid;gap:14px;}
  .file{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent-soft);
    border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);}
  .file.done{border-left-color:var(--ok);}
  .file h3{margin:0 0 4px;font-size:19px;font-weight:400;word-break:break-word;}
  .file .meta{font:13px/1.6 "Trebuchet MS",sans-serif;color:var(--dim);margin:0 0 12px;}
  .file .meta .ok{color:var(--ok);}
  .file .meta .warn{color:var(--warn);}
  .file .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .file details{margin-left:auto;}
  .file summary{cursor:pointer;font:13px/1 "Trebuchet MS",sans-serif;color:var(--accent);border-bottom:1px solid #d9c49a;}
  .file summary:hover{border-bottom-color:var(--accent);}
  .file textarea{width:100%;min-height:200px;margin-top:12px;background:#faf7ef;color:#3c382f;
    border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 "Courier New",monospace;resize:vertical;white-space:pre;}
  footer{margin-top:60px;text-align:center;font:13px/1.8 "Trebuchet MS",sans-serif;color:#9a927f;}
  .hidden{display:none;}
  *:focus-visible{outline:2px dotted var(--accent);outline-offset:2px;}
  @media(max-width:560px){
    main{padding:32px 16px 48px;}
    h1{font-size:32px;}
    .drop{padding:38px 16px;}
    .topbar{flex-direction:column;gap:12px;margin-bottom:28px;}
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="mark">PDF<span>&nbsp;→&nbsp;</span>MD</div>
    <a class="author-link" href="https://github.com/EdwardScorpio" rel="noopener">by Edward Scorpio</a>
  </div>

  <header>
    <h1>PDF → Markdown</h1>
    <p class="tag">Бесплатно · без сервера · файлы не покидают ваше устройство</p>
  </header>

  <div class="drop" id="drop">
    <div class="drop-icon">&#8595;</div>
    <div>Перетащите PDF сюда или <b>выберите файл</b></div>
    <div class="hint">можно сразу несколько</div>
  </div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>

  <div class="controls">
    <button class="btn" id="btn">Конвертировать</button>
    <button class="btn ghost" id="clearBtn">Очистить</button>
    <label class="check"><input type="checkbox" id="compact"> компактный вывод</label>
  </div>

  <div id="status" role="log" aria-live="polite"></div>

  <div id="list"></div>

  <footer>
    Работает прямо в браузере — загруженные PDF не передаются никуда.<br>
    На базе <a href="https://github.com/firecrawl/pdf-inspector" rel="noopener">pdf-inspector</a> (WebAssembly) ·
    автор <a href="https://github.com/EdwardScorpio" rel="noopener">Edward Scorpio</a>
  </footer>
</main>

<script>
(function(){
  var STATUS = document.getElementById("status");
  function log(line, cls){
    var el = document.createElement("div");
    el.className = "ln " + (cls || "");
    el.textContent = line;
    STATUS.appendChild(el);
    while (STATUS.childNodes.length > 40) STATUS.removeChild(STATUS.firstChild);
  }

  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("fileInput");
  var btn = document.getElementById("btn");
  var clearBtn = document.getElementById("clearBtn");
  var compactCb = document.getElementById("compact");
  var list = document.getElementById("list");

  var files = [];
  var seq = 0;
  var busy = false;

  var worker = null;
  var workerReady = false;
  var workerError = null;
  var pending = {};

  function startWorker(){
    if (worker) return;
    try {
      worker = new Worker("/pdf-inspector/worker.js", { type: "module" });
    } catch (e) {
      workerError = "web worker не поддерживается: " + e;
      log("! worker error: " + workerError, "err");
      return;
    }
    worker.onmessage = function (ev) {
      var m = ev.data;
      if (m.type === "ready") {
        workerReady = true;
        log("> конвертер загружен", "ok");
        if (queueStart) pumpQueue();
      } else if (m.type === "error") {
        workerError = m.message;
        log("! " + m.message, "err");
      } else if (m.type === "done") {
        handleDone(m);
      }
    };
    worker.onerror = function (e) {
      workerError = (e && e.message) || "worker failed";
      log("! " + workerError, "err");
    };
    log("> загружаю конвертер (wasm ~5 МБ)…");
  }

  function addFiles(listNew){
    for (var i = 0; i < listNew.length; i++) {
      var f = listNew[i];
      if (f.type !== "application/pdf" && !f.name.toLowerCase().endsWith(".pdf")) {
        log("! пропущен (не PDF): " + f.name, "err");
        continue;
      }
      files.push(f);
    }
    renderList();
    log("> в очереди: " + files.length + " файл(ов)");
  }

  function renderList(){
    list.textContent = "";
    files.forEach(function (f, idx) {
      var box = document.createElement("div");
      box.className = "file";
      var h = document.createElement("h3");
      h.textContent = f.name;
      var meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = fmtSize(f.size) + " · ждёт очереди";
      var acts = document.createElement("div");
      acts.className = "acts hidden";
      box.appendChild(h); box.appendChild(meta); box.appendChild(acts);
      list.appendChild(box);
      f._row = box; f._meta = meta; f._acts = acts;
    });
  }

  function fmtSize(n){
    if (n < 1024) return n + " Б";
    if (n < 1048576) return (n / 1024).toFixed(1) + " КБ";
    return (n / 1048576).toFixed(2) + " МБ";
  }

  var queueStart = false;
  function pumpQueue(){
    if (busy || !workerReady || files.length === 0) return;
    busy = true;
    var f = files[0];
    var id = ++seq;
    log("> конвертирую: " + f.name);
    f._meta.textContent = fmtSize(f.size) + " · конвертирую…";
    f.arrayBuffer().then(function (buf) {
      var t0 = Date.now();
      worker.postMessage({ type: "convert", id: id, buffer: buf, compact: compactCb.checked }, [buf]);
      pending[id] = { file: f, t0: t0 };
    }).catch(function (e) {
      log("! ошибка чтения: " + f.name, "err");
      f._meta.textContent = fmtSize(f.size) + " · ошибка чтения";
      busy = false;
      pumpQueue();
    });
  }

  function handleDone(m){
    var item = pending[m.id];
    if (!item) return;
    delete pending[m.id];
    var f = item.file;
    var ms = Date.now() - item.t0;
    busy = false;

    if (m.error) {
      log("! не удалось: " + f.name + " (" + m.error + ")", "err");
      f._meta.textContent = fmtSize(f.size) + " · ошибка: " + m.error;
      pumpQueue();
      return;
    }
    var r = m.result;
    var typeMap = { TextBased: "текстовый", Scanned: "скан", ImageBased: "изображение", Mixed: "смешанный" };
    var tl = typeMap[r.pdfType] || r.pdfType;

    var parts = [];
    parts.push("тип: " + tl + " (" + Math.round(r.confidence * 100) + "%)");
    parts.push("стр: " + r.pageCount);
    parts.push("время: " + ms + " мс");
    var line = parts.join(" · ");

    if (r.markdown) {
      log("> готово: " + f.name, "ok");
      f._markdown = r.markdown;
      f._row.classList.add("done");
      f._meta.innerHTML = fmtSize(f.size) + " · " + esc(line);
      f._meta.classList.add("ok");
      buildActions(f);
    } else {
      var why = "В этом PDF текст не извлечён";
      if (r.pdfType === "Scanned" || r.pdfType === "ImageBased") {
        why = "Похоже, это скан (фотографии страниц) — текст из таких файлов достать нельзя, нужна отдельная программа распознавания (OCR)";
      }
      log("! " + f.name + ": " + why, "err");
      f._meta.innerHTML = fmtSize(f.size) + " · " + esc(line) + "<br><span class='warn'>" + esc(why) + "</span>";
    }
    pumpQueue();
  }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function buildActions(f){
    f._acts.classList.remove("hidden");
    f._acts.textContent = "";
    var dl = document.createElement("button");
    dl.className = "btn mini";
    dl.textContent = "Скачать .md";
    dl.onclick = function () { downloadMd(f); };
    var cp = document.createElement("button");
    cp.className = "btn ghost mini";
    cp.textContent = "Копировать";
    cp.onclick = function () { copyMd(f, cp); };
    var dt = document.createElement("details");
    var sm = document.createElement("summary");
    sm.textContent = "показать markdown";
    var ta = document.createElement("textarea");
    ta.value = f._markdown;
    ta.readOnly = true;
    dt.appendChild(sm); dt.appendChild(ta);
    f._acts.appendChild(dl); f._acts.appendChild(cp); f._acts.appendChild(dt);
  }

  function baseName(name){
    var s = name.toLowerCase();
    return s.endsWith(".pdf") ? name.slice(0, -4) : name;
  }

  function downloadMd(f){
    var blob = new Blob([f._markdown], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = baseName(f.name) + ".md";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 900);
  }

  function copyMd(f, btnEl){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(f._markdown).then(function () {
        btnEl.textContent = "готово!";
        setTimeout(function () { btnEl.textContent = "Копировать"; }, 1200);
      });
    } else {
      var ta = document.createElement("textarea");
      ta.value = f._markdown;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
  }

  drop.addEventListener("click", function () { fileInput.click(); });
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault();
    drop.classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files) addFiles(Array.prototype.slice.call(e.dataTransfer.files));
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files) addFiles(Array.prototype.slice.call(fileInput.files));
    fileInput.value = "";
  });

  btn.addEventListener("click", function () {
    startWorker();
    if (files.length === 0) { log("! сначала выберите PDF", "err"); return; }
    if (!workerReady) { log("! конвертер ещё грузится", "err"); return; }
    queueStart = true;
    pumpQueue();
  });

  clearBtn.addEventListener("click", function () {
    files.length = 0;
    list.textContent = "";
    log("> очищено");
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/pdf-inspector/sw.js").then(function () {
      log("> офлайн-режим готов");
    }).catch(function (e) {
      log("! sw: " + e, "err");
    });
  }

  var q = new URLSearchParams(location.search);
  if (q.get("shared") === "1") {
    log("> получен файл из «Поделиться»");
    fetch("/pdf-inspector/shared-file").then(function (r) {
      if (!r.ok) throw new Error("no shared file");
      return r.blob();
    }).then(function (blob) {
      var f = new File([blob], "shared.pdf", { type: "application/pdf" });
      startWorker();
      addFiles([f]);
      btn.click();
    }).catch(function (e) {
      log("! share: " + e, "err");
    });
  }
  if (q.get("shared") === "error") {
    log("! не удалось получить файл из «Поделиться»", "err");
  }

  log("> привет. перетащите PDF — и всё");
})();
</script>
</body>
</html>
